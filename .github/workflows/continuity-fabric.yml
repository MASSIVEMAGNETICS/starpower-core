name: Continuity Fabric

on:
  pull_request:
    paths:
      - "starpower_core/continuity.py"
      - "tests/test_continuity_fabric.py"
      - "docs/CONTINUITY_FABRIC.md"
      - "pyproject.toml"
      - ".github/workflows/continuity-fabric.yml"
  push:
    branches: [main]
    paths:
      - "starpower_core/continuity.py"
      - "tests/test_continuity_fabric.py"
      - "docs/CONTINUITY_FABRIC.md"
      - "pyproject.toml"
      - ".github/workflows/continuity-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ledgers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint continuity increment
        run: ruff check starpower_core/continuity.py tests/test_continuity_fabric.py

      - name: Run continuity acceptance tests
        run: pytest tests/test_continuity_fabric.py

      - name: Exercise ledger CLI
        run: |
          ROOT="${RUNNER_TEMP}/continuity-ledgers"
          starpower-ledger init --root "$ROOT"
          starpower-ledger verify --root "$ROOT"
          starpower-ledger progress --root "$ROOT"
