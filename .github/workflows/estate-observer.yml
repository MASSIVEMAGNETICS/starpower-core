name: Estate Observer

on:
  pull_request:
    paths:
      - "starpower_core/estate.py"
      - "starpower_core/development.py"
      - "starpower_core/completion.py"
      - "starpower_core/continuity.py"
      - "tests/test_estate_observer.py"
      - "tests/test_development_observer.py"
      - "tests/test_continuity_fabric.py"
      - ".github/workflows/estate-observer.yml"
      - "docs/ESTATE_OBSERVER.md"
      - "docs/DEVELOPMENT_OBSERVER.md"
  push:
    branches:
      - main
    paths:
      - "starpower_core/estate.py"
      - "starpower_core/development.py"
      - "starpower_core/completion.py"
      - "starpower_core/continuity.py"
      - "tests/test_estate_observer.py"
      - "tests/test_development_observer.py"
      - "tests/test_continuity_fabric.py"
      - ".github/workflows/estate-observer.yml"
      - "docs/ESTATE_OBSERVER.md"
      - "docs/DEVELOPMENT_OBSERVER.md"
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

permissions:
  contents: read

concurrency:
  group: estate-observer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint estate and development observers
        run: |
          ruff check \
            starpower_core/estate.py \
            starpower_core/development.py \
            tests/test_estate_observer.py \
            tests/test_development_observer.py
      - name: Test estate, development, conflict, and continuity contracts
        run: |
          pytest -q \
            tests/test_estate_observer.py \
            tests/test_development_observer.py \
            tests/test_continuity_fabric.py

  reconcile-estate:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MASSIVE_MAGNETICS_ORG_TOKEN: ${{ secrets.MASSIVE_MAGNETICS_ORG_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Restore prior append-only estate state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .starpower /tmp/estate-restore
          mkdir -p .starpower/ledgers /tmp/estate-restore
          if git ls-remote --exit-code --heads origin estate-state >/dev/null 2>&1; then
            git fetch origin estate-state:refs/remotes/origin/estate-state
            if git cat-file -e origin/estate-state:estate/ledgers 2>/dev/null; then
              git archive origin/estate-state estate/ledgers | tar -x -C /tmp/estate-restore
              cp -R /tmp/estate-restore/estate/ledgers/. .starpower/ledgers/
            fi
          fi
      - name: Scan visible MASSIVEMAGNETICS estate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/estate
          starpower-complete scan-org MASSIVEMAGNETICS \
            --token-env MASSIVE_MAGNETICS_ORG_TOKEN \
            --output artifacts/estate/portfolio.json
      - name: Ingest verified repository estate snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -m starpower_core.estate \
            --root .starpower/ledgers \
            ingest \
            --portfolio artifacts/estate/portfolio.json \
            --source-ref "${GITHUB_SHA}" \
            | tee artifacts/estate/estate-report.json
          python -m starpower_core.estate --root .starpower/ledgers verify
      - name: Scan open pull-request development state
        shell: bash
        run: |
          set -euo pipefail
          python -m starpower_core.development \
            --root .starpower/ledgers \
            scan \
            --owner MASSIVEMAGNETICS \
            --token-env MASSIVE_MAGNETICS_ORG_TOKEN \
            --source-ref "${GITHUB_SHA}" \
            --output artifacts/estate/development.json
      - name: Ingest development state and derive conflicts
        shell: bash
        run: |
          set -euo pipefail
          python -m starpower_core.development \
            --root .starpower/ledgers \
            ingest \
            --snapshot artifacts/estate/development.json \
            | tee artifacts/estate/development-report.json
          python -m starpower_core.development --root .starpower/ledgers verify
          rm -rf artifacts/estate/derived
          cp -R .starpower/ledgers/derived artifacts/estate/derived
      - name: Stage durable state outside checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/estate-publish /tmp/estate-artifacts
          mkdir -p /tmp/estate-publish/estate/source /tmp/estate-artifacts
          cp -R .starpower/ledgers /tmp/estate-publish/estate/ledgers
          cp artifacts/estate/portfolio.json /tmp/estate-publish/estate/source/portfolio.json
          cp artifacts/estate/development.json /tmp/estate-publish/estate/source/development.json
          cp -R artifacts/estate/. /tmp/estate-artifacts/
      - name: Persist append-only estate state branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MASSIVEMAGNETICS Estate Observer"
          git config user.email "actions@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/estate-state; then
            git checkout -B estate-state origin/estate-state
          else
            git checkout --orphan estate-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf estate
          cp -R /tmp/estate-publish/estate ./estate
          git add estate
          if git diff --cached --quiet; then
            echo "Estate state unchanged; no state commit required."
          else
            git commit -m "estate: append verified repository and development snapshot ${GITHUB_RUN_ID}"
            git push origin HEAD:estate-state
          fi
      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estate-observer-${{ github.run_id }}
          path: /tmp/estate-artifacts/
          if-no-files-found: error
          retention-days: 90
